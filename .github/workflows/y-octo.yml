name: Lint & Test & Fuzzing & Miri & Loom

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  nightly: nightly-2026-01-10

# Cancels all previous workflow runs for pull requests that have not completed.
# See https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  # The concurrency group contains the workflow name and the branch name for
  # pull requests or the commit hash for any other events.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          components: clippy, rustfmt
          workspaces: |
            . -> target
            y-octo-utils/fuzz -> target

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Install required cargo components
        uses: taiki-e/install-action@v2
        with:
          tool: clippy-sarif,sarif-fmt

      - name: Check repository test payload budget
        run: node y-octo/tests/oracle/budget.mjs

      - name: Format check
        run: |
          yarn prettier --check .
          yarn taplo fmt --check .
          cargo +nightly fmt --all --check

      - name: Build & Check
        run: |
          set -o pipefail
          cargo +nightly clippy --all-features --message-format=json -- -D warnings | clippy-sarif | tee rust-clippy-results.sarif | sarif-fmt
          RUSTDOCFLAGS="-D rustdoc::broken-intra-doc-links" cargo doc --workspace --all-features --no-deps
        env:
          CARGO_TERM_COLOR: always

      - name: Lint fuzz targets
        run: |
          cargo +nightly fmt --manifest-path y-octo-utils/fuzz/Cargo.toml --check
          RUSTFLAGS="--cfg fuzzing" cargo +nightly clippy --manifest-path y-octo-utils/fuzz/Cargo.toml --all-targets -- -D warnings

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: rust-clippy-results.sarif
          wait-for-processing: true

  test:
    name: test & collect coverage
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
      - name: Install latest nextest release
        uses: taiki-e/install-action@nextest
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Collect coverage data
        run: cargo llvm-cov nextest --all-targets --lcov --output-path lcov.info
      - name: Upload coverage data to codecov
        uses: codecov/codecov-action@v5
        with:
          name: tests
          files: lcov.info

  loom:
    name: loom thread test
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg loom
      RUST_BACKTRACE: full
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
      - name: Install latest nextest release
        uses: taiki-e/install-action@nextest

      - name: Loom Thread Test
        run: |
          cargo nextest run -p y-octo --lib

  miri:
    name: miri code check
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: full
      CARGO_TERM_COLOR: always
      MIRIFLAGS: -Zmiri-backtrace=full -Zmiri-tree-borrows
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.nightly }}
          components: miri
      - name: Install latest nextest release
        uses: taiki-e/install-action@nextest

      - name: Miri Code Check
        run: |
          cargo +${{ env.nightly }} miri nextest run -p y-octo -j2

  asan:
    name: Address sanitizer
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings -Zsanitizer=address
      ASAN_OPTIONS: detect_leaks=1
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.nightly }}

      - name: Memory Check
        run: |
          rustup component add rust-src --toolchain ${{ env.nightly }}
          cargo +${{ env.nightly }} test -Zbuild-std --target x86_64-unknown-linux-gnu -p y-octo --lib

  differential:
    name: bidirectional Yjs differential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: y-octo/tests/oracle/package-lock.json
      - name: Install pinned oracle and verify materials
        run: |
          npm ci --prefix y-octo/tests/oracle --ignore-scripts
          npm run check --prefix y-octo/tests/oracle
      - name: Run online differential batch
        run: |
          cargo test -p y-octo --test trace_differential --features large_refs online_yjs_differential -- --ignored --exact --nocapture
          cargo test -p y-octo --test legacy_yjs_wire --features large_refs online_legacy_yjs_roundtrip -- --ignored --exact --nocapture
          cargo test -p y-octo --test trace_differential --features large_refs online_fuzz_trajectories -- --ignored --exact --nocapture
          cargo test -p y-octo --test detached_child --features large_refs online_preliminary_yjs_roundtrip -- --ignored --exact --nocapture
          cargo test -p y-octo --test format_cleanup --features large_refs online_format_cleanup_persistent_replicas -- --ignored --exact --nocapture
      - name: Preserve minimized failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: differential-traces
          path: target/trace-failures
          if-no-files-found: ignore

  upstream_factory:
    name: upstream Yjs factory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: y-octo/tests/oracle/package-lock.json
      - name: Generate pinned upstream corpus and verify manifest
        run: |
          npm ci --prefix y-octo/tests/oracle --ignore-scripts
          npm run check:upstream --prefix y-octo/tests/oracle
          node y-octo/tests/oracle/upstream.mjs --report >> "$GITHUB_STEP_SUMMARY"
      - name: Replay every recorded document
        run: cargo test --release -p y-octo --test yjs_upstream_oracle --features large_refs replay_upstream_factory -- --ignored --exact --nocapture
      - name: Verify full exports for the registered text-reader gap
        run: node y-octo/tests/oracle/upstream-exports.mjs
      - name: Preserve generated corpus on failure or manual request
        if: ${{ failure() || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: upstream-oracle
          path: target/yjs-oracle
          if-no-files-found: ignore
          retention-days: 7
