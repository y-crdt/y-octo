name: Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
  # Keep the benchmark label to benchmark subsequent PR heads too.
  pull_request:
    types: [opened, reopened, synchronize, labeled]

# Only events that run PR benchmarks share a cancellation group. Skipped label
# events must not cancel a measurement or its pending result publication.
# Cancellation includes comparison and PR comment publication.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'pull_request' &&
      (contains(github.event.pull_request.labels.*.name, 'benchmark') &&
       (github.event.action != 'labeled' || github.event.label.name == 'benchmark') &&
       format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id)) ||
      github.sha
    }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'benchmark') &&
       (github.event.action != 'labeled' || github.event.label.name == 'benchmark'))
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest] # `macos-latest` is too unstable to be useful for benchmark, the variance is always huge.
    name: Run benchmark on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: stable

      - name: Run Bench on main Branch
        run: |
          cargo bench -p y-octo --bench codec_benchmarks --features bench -- --save-baseline main
          cargo bench -p y-octo --bench array_ops_benchmarks --features bench -- --save-baseline main
          cargo bench -p y-octo --bench map_ops_benchmarks --features bench -- --save-baseline main
          cargo bench -p y-octo --bench text_ops_benchmarks --features bench -- --save-baseline main
          cargo bench -p y-octo --bench update_benchmarks --features bench -- --save-baseline main

      - name: Checkout PR head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run Bench on PR Branch
        if: github.event_name == 'pull_request'
        run: |
          cargo bench -p y-octo --bench codec_benchmarks --features bench -- --save-baseline pr
          cargo bench -p y-octo --bench array_ops_benchmarks --features bench -- --save-baseline pr
          cargo bench -p y-octo --bench map_ops_benchmarks --features bench -- --save-baseline pr
          cargo bench -p y-octo --bench text_ops_benchmarks --features bench -- --save-baseline pr
          cargo bench -p y-octo --bench update_benchmarks --features bench -- --save-baseline pr

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.os }}
          path: ./target/criterion

  benchmark-compare:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    name: Compare Benchmarks
    needs:
      - benchmark

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: stable

      - name: Install critcmp
        uses: taiki-e/install-action@v2
        with:
          tool: critcmp

      - name: Linux | Download PR benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results-ubuntu-latest
          path: ./target/criterion

      - name: Linux | Compare benchmark results
        shell: bash
        run: |
          critcmp main pr | cargo run -p y-octo-utils --bin bench_result_render --features bench -- Linux >> summary.md
          echo "" >> summary.md

      - name: Linux | Cleanup benchmark results
        run: rm -rf ./target/criterion

      - name: Windows | Download PR benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results-windows-latest
          path: ./target/criterion

      - name: Windows | Compare benchmark results
        shell: bash
        run: |
          critcmp main pr | cargo run -p y-octo-utils --bin bench_result_render --features bench -- Windows >> summary.md

      - name: Publish benchmark summary
        shell: bash
        run: cat summary.md > "$GITHUB_STEP_SUMMARY"

      - name: Find Comment
        # Check if the event is not triggered by a fork
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "## Benchmark for Linux"

      - name: Create or update comment
        # Check if the event is not triggered by a fork
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          comment-id: ${{ steps.fc.outputs.comment-id }}
          body-file: summary.md
