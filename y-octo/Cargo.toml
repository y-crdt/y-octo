[package]
authors = [
  "DarkSky <darksky2048@gmail.com>",
  "forehalo <forehalo@gmail.com>",
  "x1a0t <405028157@qq.com>",
  "Brooklyn <lynweklm@gmail.com>",
]
description = "High-performance and thread-safe CRDT implementation compatible with Yjs"
edition = "2024"
homepage = "https://github.com/toeverything/y-octo"
include = ["src/**/*", "benches/**/*", "bin/**/*", "LICENSE", "README.md"]
keywords = ["collaboration", "crdt", "crdts", "yjs", "yata"]
license = "MIT"
name = "y-octo"
readme = "README.md"
repository = "https://github.com/toeverything/y-octo"
version = "0.2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# runtime-rng (getrandom) only with the `random` feature; keys from the
# build otherwise
ahash         = { workspace = true, features = ["std", "compile-time-rng"] }
byteorder     = { workspace = true }
log           = { workspace = true }
nanoid        = { workspace = true, optional = true }
nom           = { workspace = true }
ordered-float = { workspace = true }
rand          = { workspace = true, optional = true }
serde         = { workspace = true, features = ["derive"] }
serde_json    = { workspace = true }
smol_str      = { workspace = true }
thiserror     = { workspace = true }

[features]
bench      = []
debug      = []
default    = ["random"]
large_refs = []
# Random default client IDs and GUIDs (`DocOptions::default`, `Doc::new`) and
# runtime hash keys, through getrandom. Without it (for example on
# wasm32-unknown-unknown) the host passes both with
# `DocOptions::from_identity` and no JS randomness backend is needed.
random     = ["dep:rand", "dep:nanoid", "ahash/runtime-rng"]
serde_json = []

[target.'cfg(fuzzing)'.dependencies]
arbitrary     = { workspace = true }
ordered-float = { workspace = true, features = ["arbitrary"] }

[target.'cfg(loom)'.dependencies]
indexmap = "2"
loom = { workspace = true }
# override the dev-dependencies feature
async-lock = { workspace = true }

[dev-dependencies]
assert-json-diff = { workspace = true }
criterion        = { workspace = true }
flate2           = "1"
ordered-float    = { workspace = true, features = ["proptest"] }
path-ext         = { workspace = true }
proptest         = { workspace = true }
proptest-derive  = { workspace = true }
rand             = { workspace = true }
rand_chacha      = { workspace = true }
sha2             = "0.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(debug)',
  'cfg(fuzzing)',
  'cfg(loom)',
] }

[[bench]]
harness = false
name    = "array_ops_benchmarks"

[[bench]]
harness = false
name    = "codec_benchmarks"

[[bench]]
harness = false
name    = "map_ops_benchmarks"

[[bench]]
harness = false
name    = "text_ops_benchmarks"

[[bench]]
harness = false
name    = "apply_benchmarks"

[[bench]]
harness = false
name    = "apply_scaling_benchmarks"

[[bench]]
harness = false
name    = "update_benchmarks"

[[bench]]
harness = false
name    = "readonly_benchmarks"

[lib]
bench = true
