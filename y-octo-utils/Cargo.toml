[package]
authors = ["x1a0t <405028157@qq.com>", "DarkSky <darksky2048@gmail.com>"]
edition = "2024"
license = "MIT"
name    = "y-octo-utils"
version = "0.0.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
bench     = ["regex"]
default   = ["merger"]
merger    = ["clap", "y-octo/large_refs"]
profiling = ["y-octo/debug", "y-octo/large_refs"]

[dependencies]
clap        = { workspace = true, features = ["derive"], optional = true }
rand        = { workspace = true }
rand_chacha = { workspace = true }
regex       = { workspace = true, optional = true }
reqwest     = { workspace = true }
serde_json  = { workspace = true }
y-octo      = { workspace = true }

[[bin]]
name = "bench_result_render"
path = "bin/bench_result_render.rs"

[[bin]]
name = "doc_merger"
path = "bin/doc_merger.rs"

[[bin]]
name = "memory_leak_test"
path = "bin/memory_leak_test.rs"

[[bin]]
name              = "profile_ydoc"
path              = "bin/profile_ydoc.rs"
required-features = ["profiling"]

[[bin]]
name = "tg_notify"
path = "bin/tg_notify.rs"
