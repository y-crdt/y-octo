[workspace]

members  = ["y-octo", "y-octo-utils"]
resolver = "2"

  [workspace.dependencies]
  ahash = { version = "0.8", default-features = false }
  arbitrary = { version = "1.4", features = ["derive"] }
  assert-json-diff = "2.0"
  async-lock = { version = "3.4", features = ["loom"] }
  byteorder = "1.5"
  clap = { version = "4.6", features = ["derive"] }
  criterion = { version = "0.8", features = ["html_reports"] }
  log = "0.4"
  loom = { version = "0.7", features = ["checkpoint"] }
  nanoid = "0.5"
  nom = "8"
  ordered-float = "5"
  path-ext = "0.1.2"
  proptest = "1.11"
  proptest-derive = "0.8"
  rand = "0.10"
  rand_chacha = "0.10"
  regex = "1.13"
  reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
  ] }
  ryu-js = "1"
  serde = "1"
  serde_json = "1"
  smol_str = "0.3"
  thiserror = "2"
  y-octo = { path = "./y-octo" }

[profile.release]
codegen-units = 1
lto           = true
opt-level     = 3

[profile.fast-release]
codegen-units = 16
inherits      = "release"
lto           = false

[profile.profiling]
debug    = true
inherits = "fast-release"

